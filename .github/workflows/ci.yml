name: CI

on:
  pull_request:
    branches:
      - Development
      - main
  push:
    branches:
      - Development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: |
          pnpm run test:auth:password-reset:unit
          pnpm run test:users:approval:unit
          pnpm run test:tickets:unit
          pnpm run test:tickets:resolved:unit
          pnpm run test:tickets:access-policy:unit
          pnpm run test:tickets:messages:unit
          pnpm run test:a11y:contrast
          pnpm run test:municipalities:seed
