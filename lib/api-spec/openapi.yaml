openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API do Sistema de Suporte TI
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Saúde do servidor
  - name: auth
    description: Autenticação e autorização
  - name: users
    description: Gerenciamento de usuários
  - name: tickets
    description: Gerenciamento de chamados
  - name: messages
    description: Mensagens dos chamados
  - name: ratings
    description: Avaliações dos chamados
  - name: reports
    description: Relatórios

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Verificação de saúde
      description: Retorna o status de saúde do servidor
      responses:
        "200":
          description: Saudável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ───────── AUTH ─────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Registrar novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autenticar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerrar sessão
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Perfil do usuário autenticado
      responses:
        "200":
          description: Dados do usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ───────── USERS ─────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Listar usuários (ADMIN)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, INACTIVE]
        - name: role
          in: query
          schema:
            type: string
            enum: [USER, COORDINATOR, ANALYST, ADMIN]
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Obter usuário por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Atualizar usuário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/approve:
    post:
      operationId: approveUser
      tags: [users]
      summary: Aprovar usuário pendente (ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveUserBody"
      responses:
        "200":
          description: Usuário aprovado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ───────── TICKETS ─────────
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: Listar chamados
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, AWAITING_CUSTOMER]
        - name: type
          in: query
          schema:
            type: string
            enum: [SOFTWARE, HARDWARE]
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH]
        - name: uf
          in: query
          schema:
            type: string
        - name: municipality
          in: query
          schema:
            type: string
        - name: mine
          in: query
          schema:
            type: boolean
        - name: noCoordinator
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de chamados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Abrir novo chamado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketBody"
      responses:
        "201":
          description: Chamado criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/resolved:
    get:
      operationId: listResolvedTickets
      tags: [tickets]
      summary: Listar chamados resolvidos
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RESOLVED, CLOSED]
        - name: type
          in: query
          schema:
            type: string
            enum: [SOFTWARE, HARDWARE]
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH]
        - name: uf
          in: query
          schema:
            type: string
        - name: municipality
          in: query
          schema:
            type: string
        - name: mine
          in: query
          schema:
            type: boolean
        - name: noCoordinator
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de chamados resolvidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Obter chamado por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chamado encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "404":
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Atualizar chamado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketBody"
      responses:
        "200":
          description: Chamado atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/assign:
    post:
      operationId: assignTicket
      tags: [tickets]
      summary: Atribuir chamado a analista
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketBody"
      responses:
        "200":
          description: Chamado atribuído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/collaborators:
    get:
      operationId: listTicketCollaborators
      tags: [tickets]
      summary: Listar colaboradores de um chamado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de colaboradores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRef"
        "404":
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addTicketCollaborators
      tags: [tickets]
      summary: Adicionar colaboradores em um chamado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: integer
              required:
                - userIds
      responses:
        "200":
          description: Lista de colaboradores atualizada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRef"
        "404":
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/collaborators/{userId}:
    delete:
      operationId: removeTicketCollaborator
      tags: [tickets]
      summary: Remover colaborador de um chamado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Colaborador removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Chamado ou colaborador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ───────── MESSAGES ─────────
  /tickets/{ticketId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Listar mensagens de um chamado
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de mensagens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: createMessage
      tags: [messages]
      summary: Enviar mensagem em um chamado
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Mensagem enviada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ───────── RATINGS ─────────
  /tickets/{ticketId}/rating:
    get:
      operationId: getTicketRating
      tags: [ratings]
      summary: Obter avaliação de um chamado
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Avaliação encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "404":
          description: Avaliação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: rateTicket
      tags: [ratings]
      summary: Avaliar chamado resolvido
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRatingBody"
      responses:
        "201":
          description: Avaliação registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ───────── REPORTS / WOW ─────────
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Resumo geral do sistema
      responses:
        "200":
          description: Resumo com totais e indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"

  /reports/by-status:
    get:
      operationId: getTicketsByStatus
      tags: [reports]
      summary: Chamados agrupados por status
      responses:
        "200":
          description: Contagem por status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /reports/by-region:
    get:
      operationId: getTicketsByRegion
      tags: [reports]
      summary: Chamados agrupados por UF
      responses:
        "200":
          description: Contagem por UF
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionCount"

  /reports/by-type:
    get:
      operationId: getTicketsByType
      tags: [reports]
      summary: Chamados agrupados por tipo
      responses:
        "200":
          description: Contagem por tipo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TypeCount"

  /reports/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [reports]
      summary: Atividade recente do sistema
      responses:
        "200":
          description: Últimas atividades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # ─── Auth ───
    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
        establishment:
          type: string
        contactPhone:
          type: string
        prefersWhatsapp:
          type: boolean
        prefersTelegram:
          type: boolean
        termsAccepted:
          type: boolean
        uf:
          type: string
        municipality:
          type: string
      required:
        - name
        - email
        - password
        - birthDate
        - cpf
        - establishment
        - contactPhone
        - termsAccepted
        - uf
        - municipality

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    # ─── User ───
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, COORDINATOR, ANALYST, ADMIN]
        status:
          type: string
          enum: [PENDING, ACTIVE, INACTIVE]
        cpf:
          type: ["string", "null"]
        establishment:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        prefersWhatsapp:
          type: boolean
        prefersTelegram:
          type: boolean
        termsAccepted:
          type: boolean
        termsAcceptedAt:
          type: ["string", "null"]
          format: date-time
        birthDate:
          type: ["string", "null"]
          format: date
        uf:
          type: string
        municipality:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - status
        - prefersWhatsapp
        - prefersTelegram
        - termsAccepted
        - uf
        - municipality
        - createdAt

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        cpf:
          type: string
        establishment:
          type: string
        contactPhone:
          type: string
        prefersWhatsapp:
          type: boolean
        prefersTelegram:
          type: boolean
        uf:
          type: string
        municipality:
          type: string
        birthDate:
          type: string
          format: date

    ApproveUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [USER, COORDINATOR, ANALYST, ADMIN]
      required:
        - role

    # ─── Ticket ───
    Ticket:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [SOFTWARE, HARDWARE]
        hardwareSubtype:
          type: ["string", "null"]
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, AWAITING_CUSTOMER, RESOLVED, CLOSED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        uf:
          type: string
        municipality:
          type: string
        establishment:
          type: ["string", "null"]
        imageAttachmentsCount:
          type: integer
        createdById:
          type: integer
        assignedToId:
          type: ["integer", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
        ownerHasCoordinator:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/UserRef"
        assignedTo:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
      required:
        - id
        - title
        - description
        - type
        - status
        - priority
        - uf
        - municipality
        - createdById
        - assignedToId
        - createdAt
        - updatedAt
        - createdBy

    TicketAttachment:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - mimeType
        - size
        - createdAt

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            rating:
              oneOf:
                - $ref: "#/components/schemas/Rating"
                - type: "null"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/TicketAttachment"
            collaborators:
              type: array
              items:
                $ref: "#/components/schemas/UserRef"

    UserRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, COORDINATOR, ANALYST, ADMIN]
      required:
        - id
        - name
        - email
        - role

    CreateTicketBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        establishment:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [SOFTWARE, HARDWARE]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        hardwareSubtype:
          type: string
      required:
        - title
        - description
        - establishment
        - type
        - priority

    UpdateTicketBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, AWAITING_CUSTOMER, RESOLVED, CLOSED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]

    AssignTicketBody:
      type: object
      properties:
        assignedToId:
          type: integer
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - assignedToId
        - reason

    # ─── Message ───
    Message:
      type: object
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        senderId:
          type: integer
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        sender:
          $ref: "#/components/schemas/UserRef"
      required:
        - id
        - ticketId
        - senderId
        - message
        - createdAt
        - sender

    CreateMessageBody:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # ─── Rating ───
    Rating:
      type: object
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        userId:
          type: integer
        score:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ticketId
        - userId
        - score
        - createdAt

    CreateRatingBody:
      type: object
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: string
      required:
        - score

    # ─── Reports ───
    ReportSummary:
      type: object
      properties:
        totalTickets:
          type: integer
        openTickets:
          type: integer
        inProgressTickets:
          type: integer
        resolvedTickets:
          type: integer
